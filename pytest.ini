[pytest]
# Конфигурация pytest для NexusRPG

# Пути поиска тестов
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Настройки вывода
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Маркеры
markers =
    slow: медленные тесты (пропускать по умолчанию)
    integration: интеграционные тесты
    requires_ai: тесты требующие AI-бэкенд
    requires_db: тесты требующие базу данных

# Исключения
norecursedirs = 
    .git
    .github
    __pycache__
    build
    dist
    *.egg-info
    _internal
    node_modules
